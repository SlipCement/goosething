<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Run From the Goose — Hard Mode FIXED</title>
<style>
  body { margin: 0; background: #eef; overflow: hidden; }
  canvas { display: block; background: #c8f7ff; }
  #timer {
    position: fixed;
    top: 10px;
    left: 10px;
    font-size: 24px;
    font-family: Arial;
    background: white;
    padding: 6px 10px;
    border-radius: 6px;
  }
</style>
</head>
<body>
<div id="timer">0.0s</div>
<canvas id="game"></canvas>

<script>
// ===== SETUP =====
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = innerWidth;
canvas.height = innerHeight;

const player = { x: 200, y: 200, size: 30, speed: 4 };

let geese = [
  { x: 800, y: 400, size: 40, baseSpeed: 2.2, speed: 2.2 }
];

let gameTime = 0;
let lastTime = performance.now();

// Keys
const keys = {};
addEventListener("keydown", e => keys[e.key] = true);
addEventListener("keyup", e => keys[e.key] = false);

// ===== UPDATE =====
function update(dt) {
  if (!Number.isFinite(dt)) dt = 16; // fallback so no NaNs ever happen

  gameTime += dt;
  document.getElementById("timer").textContent =
    (gameTime / 1000).toFixed(1) + "s";

  // Player movement
  if (keys["w"] || keys["ArrowUp"]) player.y -= player.speed;
  if (keys["s"] || keys["ArrowDown"]) player.y += player.speed;
  if (keys["a"] || keys["ArrowLeft"]) player.x -= player.speed;
  if (keys["d"] || keys["ArrowRight"]) player.x += player.speed;

  // Clamp inside screen
  player.x = Math.max(0, Math.min(canvas.width, player.x));
  player.y = Math.max(0, Math.min(canvas.height, player.y));

  // Difficulty scale
  for (let g of geese) {
    g.speed = g.baseSpeed + gameTime * 0.0004;
    if (!Number.isFinite(g.speed)) g.speed = g.baseSpeed;
  }

  // Spawn 2nd goose at 20s
  if (gameTime > 20000 && geese.length < 2) {
    geese.push({
      x: Math.random()*canvas.width,
      y: Math.random()*canvas.height,
      size: 50,
      baseSpeed: 2.8,
      speed: 2.8
    });
  }

  // Goose chasing
  for (let g of geese) {
    let dx = player.x - g.x;
    let dy = player.y - g.y;
    let dist = Math.hypot(dx, dy);

    if (dist < 1) dist = 1; // avoid division by zero

    g.x += (dx / dist) * g.speed;
    g.y += (dy / dist) * g.speed;

    // Hit detection
    if (dist < (player.size + g.size)/2) {
      alert("THE GOOSE GOT YOU at " + (gameTime/1000).toFixed(1) + "s 💀🦢");
      location.reload();
    }
  }
}

// ===== DRAW =====
function draw() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  // Player
  ctx.fillStyle = "#0077ff";
  ctx.fillRect(player.x - player.size/2, player.y - player.size/2, player.size, player.size);

  // Geese
  for (let g of geese) {
    ctx.fillStyle = "white";
    ctx.beginPath();
    ctx.ellipse(g.x, g.y, g.size, g.size*0.7, 0, 0, Math.PI*2);
    ctx.fill();

    ctx.fillStyle = "orange";
    ctx.fillRect(g.x + g.size*0.3, g.y - 5, 15, 10);

    ctx.fillStyle = "black";
    ctx.beginPath();
    ctx.arc(g.x + 10, g.y - 10, 5, 0, Math.PI*2);
    ctx.arc(g.x + 10, g.y + 10, 5, 0, Math.PI*2);
    ctx.fill();
  }
}

// ===== LOOP =====
function loop(now) {
  if (!Number.isFinite(now)) now = performance.now(); // safety
  
  let dt = now - lastTime;
  lastTime = now;

  update(dt);
  draw();
  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
