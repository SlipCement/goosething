<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8" />
<title>Run From the Goose — Box Runs</title>
<style>
body { margin:0; font-family:Arial,sans-serif; overflow:hidden; background:#eef; }
canvas { display:block; background:#c8f7ff; }
#menu, #settings { position:fixed; top:0; left:0; width:100%; height:100%; 
    background: rgba(0,0,0,0.5); display:flex; flex-direction:column; justify-content:center; align-items:center; }
button { margin:10px; font-size:24px; padding:10px 20px; cursor:pointer; }
#timer { position:fixed; top:10px; left:10px; font-size:24px; background:white; padding:6px 10px; border-radius:6px; }
label { font-size:18px; margin:5px; display:flex; align-items:center; }
input[type=range] { margin-left:10px; }
</style>
</head>
<body>

<!-- MAIN MENU -->
<div id="menu">
  <button id="playBtn">Play Mode (Avoid Goose)</button>
  <button id="gooseBtn">Goose Mode (Get Box)</button>
  <button id="settingsBtn">Settings</button>
</div>

<!-- SETTINGS MENU -->
<div id="settings" style="display:none; flex-direction:column;">
  <label>Enable Second Goose (Player Mode): <input type="checkbox" id="secondGoose" checked></label>
  <label>Goose Speed Cap: <input type="range" id="speedCap" min="3" max="10" step="0.1" value="6"></label>
  <label>Box Speed (Goose Mode): <input type="range" id="boxSpeed" min="1" max="10" step="0.1" value="3"></label>
  <button id="backBtn">Back</button>
</div>

<div id="timer" style="display:none;">0.0s</div>
<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
canvas.width = innerWidth;
canvas.height = innerHeight;

// MENU ELEMENTS
const menu = document.getElementById("menu");
const settingsMenu = document.getElementById("settings");
const timerDisplay = document.getElementById("timer");

const playBtn = document.getElementById("playBtn");
const gooseBtn = document.getElementById("gooseBtn");
const settingsBtn = document.getElementById("settingsBtn");
const backBtn = document.getElementById("backBtn");
const secondGooseCheckbox = document.getElementById("secondGoose");
const speedCapSlider = document.getElementById("speedCap");
const boxSpeedSlider = document.getElementById("boxSpeed");

let enableSecondGoose = true;
let gooseSpeedCap = parseFloat(speedCapSlider.value);
let boxSpeed = parseFloat(boxSpeedSlider.value);

let gameMode = null; // "player" or "goose"
let player, geese, box, gameTime, lastTime;
let invincible=false, inGame=false;
const keys={};

// INPUT
addEventListener("keydown", e => keys[e.key]=true);
addEventListener("keyup", e => keys[e.key]=false);

// MENU HANDLERS
playBtn.onclick = ()=>{
    menu.style.display="none";
    settingsMenu.style.display="none";
    timerDisplay.style.display="block";
    enableSecondGoose = secondGooseCheckbox.checked;
    gooseSpeedCap = parseFloat(speedCapSlider.value);
    gameMode = "player";
    startGame();
};
gooseBtn.onclick = ()=>{
    menu.style.display="none";
    settingsMenu.style.display="none";
    timerDisplay.style.display="block";
    gameMode = "goose";
    boxSpeed = parseFloat(boxSpeedSlider.value);
    startGame();
};
settingsBtn.onclick = ()=>{
    menu.style.display="none";
    settingsMenu.style.display="flex";
};
backBtn.onclick = ()=>{
    settingsMenu.style.display="none";
    menu.style.display="flex";
    enableSecondGoose = secondGooseCheckbox.checked;
    gooseSpeedCap = parseFloat(speedCapSlider.value);
    boxSpeed = parseFloat(boxSpeedSlider.value);
};

// RESET GAME
function resetGame(){
    gameTime=0;
    invincible=false;
    if(gameMode==="player"){
        player={x:200,y:200,size:30,speed:4};
        geese=[{x:800,y:400,size:40,baseSpeed:2.2,speed:2.2}];
        if(enableSecondGoose){
            geese.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,size:50,baseSpeed:2.8,speed:2.8});
        }
        invincible=true;
        setTimeout(()=>invincible=false,500);
    }else if(gameMode==="goose"){
        player={x:200,y:200,size:50,speed:5}; // you control goose
        box={x:Math.random()*(canvas.width-50)+25,y:Math.random()*(canvas.height-50)+25,size:30};
    }
}

function startGame(){
